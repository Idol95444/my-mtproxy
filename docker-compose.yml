services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mtproxy-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    container_name: mtproxy-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: >
      /bin/sh -c 'trap exit TERM; while :;
        do certbot renew --webroot --webroot-path /var/www/certbot --quiet 2>&1;
        sleep 12h & wait $${!}; done;'

  alexbers:
    build: ./src
    container_name: mtproto-final
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.py:/home/tgproxy/config.py:ro
    depends_on:
      - nginx

volumes:
  certbot_certs:
  certbot_www:
